services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    command: npm run dev
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: "5000"
      DATABASE_URL: mongodb://mongo:27017/destino?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-change-me}
      TRUST_PROXY: "false"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:8
    attach: false
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    attach: false
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  backend_node_modules:
  mongo_data:
  redis_data:
